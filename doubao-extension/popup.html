<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; padding: 12px; margin: 0; width: 200px; }
    button {
      width: 100%; padding: 10px; background: #07c160; color: #fff;
      border: 0; border-radius: 8px; font-size: 15px; cursor: pointer;
    }
    button:active { opacity: .85; }
    .tip { color: #888; font-size: 12px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <button id="run">一键勾选豆包会话</button>
  <div class="tip">请先在浏览器打开豆包页面</div>
  <script src="popup.js"></script>
</body>
</html>
